{% extends "base.html" %}

{% block title %}Ошибка - Мебельная компания «Комфорт»{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 500px; width: 100%; text-align: center;">
        <div class="card-header" style="background-color: #dc3545; color: white;">
            <h3 style="margin: 0;">{{ error_title|default('Ошибка') }}</h3>
        </div>
        <div class="card-body">
            <div style="font-size: 4rem; margin: 20px 0; color: #dc3545;">
                ⚠️
            </div>
            <p style="font-size: 1.2rem; margin-bottom: 30px;">
                {{ error_message|default('Произошла непредвиденная ошибка') }}
            </p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <a href="{{ back_url|default(url_for('index')) }}" class="btn btn-primary">
                    Вернуться назад
                </a>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">
                    На главную
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
